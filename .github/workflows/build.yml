name: Build APK

# can be triggered manually from the
# Actions tab (Run workflow button).
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # This action sets up the Android SDK and makes sdkmanager available
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.4

      # No gradlew is checked into this repo, so the Gradle version above
      # (installed by setup-gradle) is used directly instead of a wrapper.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: waorsms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
